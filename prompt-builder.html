<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Builder</title>

<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e6ee;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }

  h2 {
    margin: 0 0 4px;
    font-size: 26px;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }

  .field {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .tooltip {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    min-height: 56px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 24px;
  }

  button {
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover {
    border-color: var(--accent);
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  #output {
    background: var(--card);
    min-height: 200px;
  }

  /* Мягкое уведомление (тост) */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2430;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 1000;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>

</head>
<body>

<h2>🚀 AI Prompt Builder</h2>
<p class="subtitle">Помощник для сборки понятных промптов к нейросетям</p>

<div class="field">
  <label for="context" title="Что происходит? Опиши проект.">Контекст</label>
  <div class="tooltip">Пример: Разрабатываю центр реабилитации...</div>
  <textarea id="context"></textarea>
</div>

<div class="field">
  <label for="task" title="Что нужно получить?">Задача</label>
  <div class="tooltip">Пример: Сделать лучше, усилить концепцию...</div>
  <textarea id="task"></textarea>
</div>

<div class="field">
  <label for="limits" title="Какие условия и рамки?">Условия и рамки</label>
  <div class="tooltip">Пример: бюджет, сроки, технологии...</div>
  <textarea id="limits"></textarea>
</div>

<div class="field">
  <label for="format" title="Как должен выглядеть ответ?">Формат ответа</label>
  <div class="tooltip">Пример: список + структура</div>
  <textarea id="format"></textarea>
</div>

<div class="buttons">
  <button class="primary" onclick="generatePrompt()">🚀 Собрать</button>
  <button onclick="enhancePrompt()">🧠 Усилить</button>
  <button onclick="translatePrompt()">🌍 English</button>
  <button onclick="copyText()">📋 Копировать</button>
  <button onclick="clearAll()">🧹 Очистить</button>
</div>

<h3>Готовый промпт (можно редактировать):</h3>
<textarea id="output" rows="10"></textarea>

<div id="toast"></div>

<script>
  // Поля, которые мы запоминаем между запусками
  const FIELDS = ["context", "task", "limits", "format", "output"];

  // Тексты-инструкции для кнопок (вынесены, чтобы не дублировать)
  const ENHANCE_NOTE = "Проанализируй и улучши запрос. Добавь:\n- глубину\n- варианты решений\n- риски\n\n";
  const TRANSLATE_NOTE = "Translate into professional English:\n\n";

  // --- Мягкое уведомление вместо alert ---
  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  // --- Сборка промпта ---
  function generatePrompt() {
    const context = document.getElementById("context").value;
    const task = document.getElementById("task").value;
    const limits = document.getElementById("limits").value;
    const format = document.getElementById("format").value;

    const prompt =
      "Контекст:\n" + context +
      "\n\nЗадача:\n" + task +
      "\n\nУсловия и рамки:\n" + limits +
      "\n\nФормат ответа:\n" + format;

    document.getElementById("output").value = prompt;
    saveAll();
  }

  // --- Усилить: дописывает инструкцию сверху (без повторов) ---
  function enhancePrompt() {
    const output = document.getElementById("output");
    if (!output.value.trim()) {
      showToast("Сначала собери промпт");
      return;
    }
    if (output.value.startsWith(ENHANCE_NOTE)) {
      showToast("Инструкция «Усилить» уже добавлена");
      return;
    }
    output.value = ENHANCE_NOTE + output.value;
    saveAll();
  }

  // --- English: добавляет просьбу о переводе (без повторов) ---
  function translatePrompt() {
    const output = document.getElementById("output");
    if (!output.value.trim()) {
      showToast("Сначала собери промпт");
      return;
    }
    if (output.value.startsWith(TRANSLATE_NOTE)) {
      showToast("Инструкция перевода уже добавлена");
      return;
    }
    output.value = TRANSLATE_NOTE + output.value;
    saveAll();
  }

  // --- Копирование с честной проверкой результата ---
  async function copyText() {
    const text = document.getElementById("output").value;
    if (!text.trim()) {
      showToast("Пусто — нечего копировать");
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      showToast("Скопировано ✅");
    } catch (e) {
      // Резервный способ (на случай, если основной заблокирован браузером)
      const output = document.getElementById("output");
      output.select();
      const ok = document.execCommand("copy");
      window.getSelection().removeAllRanges();
      showToast(ok ? "Скопировано ✅" : "Не удалось — выдели текст и нажми Ctrl+C");
    }
  }

  // --- Очистить все поля ---
  function clearAll() {
    if (!confirm("Очистить все поля?")) return;
    FIELDS.forEach(id => document.getElementById(id).value = "");
    saveAll();
  }

  // --- Память между запусками (localStorage) ---
  function saveAll() {
    FIELDS.forEach(id => {
      localStorage.setItem("pb_" + id, document.getElementById(id).value);
    });
  }

  function loadAll() {
    FIELDS.forEach(id => {
      const saved = localStorage.getItem("pb_" + id);
      if (saved !== null) document.getElementById(id).value = saved;
    });
  }

  // Загружаем сохранённое при открытии и сохраняем при каждом изменении
  loadAll();
  FIELDS.forEach(id => {
    document.getElementById(id).addEventListener("input", saveAll);
  });
</script>

</body>
</html>
