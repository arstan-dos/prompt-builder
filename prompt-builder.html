<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Builder</title>

<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e6ee;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }

  h2 {
    margin: 0 0 4px;
    font-size: 26px;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }

  .field {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .tooltip {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    overflow: hidden;
    min-height: 56px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  /* Главное действие + очистка */
  .actions-main {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 8px 0 28px;
  }

  .spacer { flex: 1; }

  /* Карточка результата */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .result-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .result-header h3 {
    margin: 0;
    margin-right: auto;
    font-size: 16px;
  }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  button {
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }

  button:hover {
    border-color: var(--accent);
  }

  /* Отклик при нажатии — лёгкое «вдавливание» */
  button:active {
    transform: translateY(1px);
  }

  /* Видимая рамка при навигации с клавиатуры */
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  /* Крупная главная кнопка «Собрать» */
  button.big {
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 600;
  }

  /* «Тихая» нейтральная кнопка (напр. «Шаг назад») */
  button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }

  button.ghost:hover {
    background: rgba(31, 36, 48, 0.06);
    border-color: transparent;
    color: var(--text);
  }

  /* «Тихая» опасная кнопка «Очистить» */
  button.ghost-danger {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }

  button.ghost-danger:hover {
    background: rgba(220, 38, 38, 0.08);
    border-color: transparent;
    color: var(--danger);
  }

  #output {
    background: var(--card);
    min-height: 200px;
  }

  /* Плавное появление готового промпта */
  @keyframes promptAppear {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #output.appear {
    animation: promptAppear 0.45s ease;
  }

  /* Мягкое уведомление (тост) */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2430;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 1000;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* История запросов */
  .history {
    margin-top: 28px;
  }

  .history-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .history-header h3 {
    margin: 0;
    font-size: 18px;
  }

  .info-hint {
    margin-right: auto;
    color: var(--muted);
    font-size: 15px;
    cursor: help;
  }

  .log-empty {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }

  .log-info {
    flex: 1;
    min-width: 0;
  }

  .log-title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .log-time {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .log-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .log-actions button {
    padding: 6px 8px;
    font-size: 15px;
  }

  /* Кнопка-действие внутри тоста (напр. «Отменить») */
  .toast-action {
    margin-left: 14px;
    padding: 4px 10px;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .toast-action:hover {
    background: rgba(255, 255, 255, 0.28);
  }
</style>

</head>
<body>

<h2>🚀 AI Prompt Builder</h2>
<p class="subtitle">Помощник для сборки понятных промптов к нейросетям</p>

<div class="field">
  <label for="context" title="Что происходит? Опиши проект.">Контекст</label>
  <div class="tooltip">Пример: Разрабатываю центр реабилитации...</div>
  <textarea id="context"></textarea>
</div>

<div class="field">
  <label for="task" title="Что нужно получить?">Задача</label>
  <div class="tooltip">Пример: Сделать лучше, усилить концепцию...</div>
  <textarea id="task"></textarea>
</div>

<div class="field">
  <label for="limits" title="Какие условия и рамки?">Условия и рамки</label>
  <div class="tooltip">Пример: бюджет, сроки, технологии...</div>
  <textarea id="limits"></textarea>
</div>

<div class="field">
  <label for="format" title="Как должен выглядеть ответ?">Формат ответа</label>
  <div class="tooltip">Пример: список + структура</div>
  <textarea id="format"></textarea>
</div>

<div class="actions-main">
  <button class="primary big" onclick="generatePrompt()">🚀 Собрать промпт</button>
  <span class="spacer"></span>
  <button class="ghost" onclick="undo()" title="Вернуть предыдущее состояние (Ctrl+Z)">↶ Шаг назад</button>
  <button class="ghost-danger" onclick="clearAll()">🧹 Очистить</button>
</div>

<div class="result-card">
  <div class="result-header">
    <h3>Готовый промпт (можно редактировать)</h3>
    <div class="result-actions">
      <button onclick="enhancePrompt()">🧠 Усилить</button>
      <button class="primary" onclick="copyText()">📋 Копировать</button>
    </div>
  </div>
  <textarea id="output" rows="10"></textarea>
</div>

<div class="history">
  <div class="history-header">
    <h3>🕘 История запросов</h3>
    <span class="info-hint" title="Сохраняются последние 5 промптов. Когда появляется новый — самый старый удаляется автоматически.">ⓘ</span>
    <button class="ghost" onclick="clearLog()">Очистить историю</button>
  </div>
  <div id="logList"></div>
</div>

<div id="toast"></div>

<script>
  // Поля, которые мы запоминаем между запусками
  const FIELDS = ["context", "task", "limits", "format", "output"];

  // Текст-инструкция для кнопки «Усилить»
  const ENHANCE_NOTE = "Проанализируй и улучши запрос. Добавь:\n- глубину\n- варианты решений\n- риски\n\n";

  // --- История для «Шага назад» (хранит до 5 прошлых состояний) ---
  const HISTORY_LIMIT = 5;
  let history = [];

  // Снимок текущего содержимого всех полей
  function snapshot() {
    const s = {};
    FIELDS.forEach(id => s[id] = document.getElementById(id).value);
    return s;
  }

  // Два состояния одинаковы?
  function sameState(a, b) {
    return FIELDS.every(id => a[id] === b[id]);
  }

  // Положить конкретное состояние в историю (без дублей, не больше 5)
  function pushState(state) {
    if (history.length && sameState(history[history.length - 1], state)) return;
    history.push(state);
    if (history.length > HISTORY_LIMIT) history.shift();
  }

  // Сохранить ТЕКУЩЕЕ состояние в историю (перед изменением)
  function recordHistory() {
    pushState(snapshot());
  }

  // Применить состояние к полям
  function applyState(s) {
    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      el.value = s[id];
      autoGrow(el);
    });
    saveAll();
  }

  // Шаг назад: вернуть предыдущее состояние
  function undo() {
    if (!history.length) {
      showToast("Нечего отменять");
      return;
    }
    const cur = snapshot();
    let prev = history.pop();
    // если последнее сохранённое совпадает с текущим — берём ещё предыдущее
    if (sameState(prev, cur) && history.length) prev = history.pop();
    applyState(prev);
    showToast("Шаг назад ↶");
  }

  // --- Авто-рост поля по высоте текста ---
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  // --- Мягкое уведомление вместо alert ---
  // action (необязательно): { label, callback } — добавляет кнопку, напр. «Отменить»
  let toastTimer = null;
  function showToast(message, action) {
    const toast = document.getElementById("toast");
    toast.textContent = message;

    if (action) {
      const btn = document.createElement("button");
      btn.className = "toast-action";
      btn.textContent = action.label;
      btn.onclick = () => {
        action.callback();
        toast.classList.remove("show");
      };
      toast.appendChild(btn);
    }

    // Кнопку можно нажать, только если она есть
    toast.style.pointerEvents = action ? "auto" : "none";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    // Если есть действие — даём больше времени на нажатие
    toastTimer = setTimeout(() => toast.classList.remove("show"), action ? 5000 : 2200);
  }

  // --- Сборка промпта ---
  function generatePrompt() {
    recordHistory();
    const context = document.getElementById("context").value;
    const task = document.getElementById("task").value;
    const limits = document.getElementById("limits").value;
    const format = document.getElementById("format").value;

    const prompt =
      "Контекст:\n" + context +
      "\n\nЗадача:\n" + task +
      "\n\nУсловия и рамки:\n" + limits +
      "\n\nФормат ответа:\n" + format;

    const output = document.getElementById("output");
    output.value = prompt;
    autoGrow(output);
    saveAll();

    // Сохраняем в историю запросов (если заполнено хоть одно поле)
    if ([context, task, limits, format].some(v => v.trim() !== "")) {
      const now = Date.now();
      addToLog({
        id: now,
        time: now,
        fields: { context, task, limits, format },
        prompt: prompt
      });
    }

    // Перезапуск анимации появления
    output.classList.remove("appear");
    void output.offsetWidth; // заставляем браузер «заметить» сброс
    output.classList.add("appear");
  }

  // --- Усилить: дописывает инструкцию сверху (без повторов) ---
  function enhancePrompt() {
    const output = document.getElementById("output");
    if (!output.value.trim()) {
      showToast("Сначала собери промпт");
      return;
    }
    if (output.value.startsWith(ENHANCE_NOTE)) {
      showToast("Инструкция «Усилить» уже добавлена");
      return;
    }
    recordHistory();
    output.value = ENHANCE_NOTE + output.value;
    autoGrow(output);
    saveAll();
  }

  // --- Копирование текста в буфер (общий помощник) ---
  async function copyToClipboard(text) {
    if (!text.trim()) {
      showToast("Пусто — нечего копировать");
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      showToast("Скопировано ✅");
    } catch (e) {
      // Резервный способ (если основной заблокирован браузером)
      const tmp = document.createElement("textarea");
      tmp.value = text;
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      document.body.appendChild(tmp);
      tmp.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(tmp);
      showToast(ok ? "Скопировано ✅" : "Не удалось — выдели текст и нажми Ctrl+C");
    }
  }

  // Кнопка «Копировать» у готового промпта
  function copyText() {
    copyToClipboard(document.getElementById("output").value);
  }

  // --- Очистить все поля (сразу, с возможностью отменить) ---
  function clearAll() {
    // Если и так пусто — ничего не делаем
    const hadText = FIELDS.some(id => document.getElementById(id).value.trim() !== "");
    if (!hadText) {
      showToast("Поля уже пусты");
      return;
    }

    recordHistory(); // запоминаем перед очисткой
    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      el.value = "";
      autoGrow(el);
    });
    saveAll();

    // Мягкое уведомление с кнопкой «Отменить» (делает шаг назад)
    showToast("Очищено", { label: "Отменить", callback: undo });
  }

  // ===== История запросов =====
  const LOG_KEY = "pb_log";
  const LOG_MAX = 5; // храним только последние 5 промптов

  function loadLog() {
    try {
      return JSON.parse(localStorage.getItem(LOG_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveLog(list) {
    localStorage.setItem(LOG_KEY, JSON.stringify(list));
  }

  // Добавить запись (новые — сверху, дубли пропускаем, держим максимум 5)
  function addToLog(entry) {
    const list = loadLog();
    if (list.length && list[0].prompt === entry.prompt) return;
    list.unshift(entry);
    if (list.length > LOG_MAX) list.length = LOG_MAX;
    saveLog(list);
    renderLog();
  }

  function deleteFromLog(id) {
    saveLog(loadLog().filter(e => e.id !== id));
    renderLog();
  }

  function clearLog() {
    if (!loadLog().length) {
      showToast("История пуста");
      return;
    }
    saveLog([]);
    renderLog();
    showToast("История очищена");
  }

  function copyFromLog(id) {
    const entry = loadLog().find(e => e.id === id);
    if (entry) copyToClipboard(entry.prompt);
  }

  // Загрузить запись обратно в форму
  function loadFromLog(id) {
    const entry = loadLog().find(e => e.id === id);
    if (!entry) return;
    recordHistory(); // чтобы загрузку можно было отменить «Шагом назад»
    FIELDS.forEach(fid => {
      const el = document.getElementById(fid);
      el.value = (fid === "output") ? entry.prompt : (entry.fields[fid] || "");
      autoGrow(el);
    });
    saveAll();
    showToast("Загружено из истории ✅");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Защита от поломки разметки чужим текстом
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Короткий заголовок записи (берём «Задачу», иначе сам промпт)
  function logTitle(entry) {
    const raw = (entry.fields && entry.fields.task && entry.fields.task.trim())
      ? entry.fields.task.trim()
      : entry.prompt.trim();
    const oneLine = raw.replace(/\s+/g, " ");
    return oneLine.length > 70 ? oneLine.slice(0, 70) + "…" : (oneLine || "Без названия");
  }

  function formatTime(ms) {
    return new Date(ms).toLocaleString("ru-RU", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function renderLog() {
    const box = document.getElementById("logList");
    const list = loadLog();
    if (!list.length) {
      box.innerHTML = '<p class="log-empty">Здесь будут появляться собранные промпты.</p>';
      return;
    }
    box.innerHTML = list.map(e => `
      <div class="log-item">
        <div class="log-info">
          <div class="log-title">${escapeHtml(logTitle(e))}</div>
          <div class="log-time">${formatTime(e.time)}</div>
        </div>
        <div class="log-actions">
          <button class="ghost" onclick="copyFromLog(${e.id})" title="Копировать">📋</button>
          <button class="ghost" onclick="loadFromLog(${e.id})" title="Загрузить в форму">↩️</button>
          <button class="ghost" onclick="deleteFromLog(${e.id})" title="Удалить">🗑</button>
        </div>
      </div>
    `).join("");
  }

  // --- Память между запусками (localStorage) ---
  function saveAll() {
    FIELDS.forEach(id => {
      localStorage.setItem("pb_" + id, document.getElementById(id).value);
    });
  }

  function loadAll() {
    FIELDS.forEach(id => {
      const saved = localStorage.getItem("pb_" + id);
      if (saved !== null) document.getElementById(id).value = saved;
    });
  }

  // Состояние поля в момент, когда пользователь начал его редактировать
  let editStartState = null;

  FIELDS.forEach(id => {
    const el = document.getElementById(id);

    // Проверка орфографии (подчёркивает ошибки)
    el.spellcheck = true;

    // Запоминаем состояние ДО начала редактирования
    el.addEventListener("focus", () => { editStartState = snapshot(); });

    // Если при уходе из поля содержимое изменилось — сохраняем в историю
    el.addEventListener("blur", () => {
      if (editStartState && !sameState(editStartState, snapshot())) {
        pushState(editStartState);
      }
    });

    // При наборе: сохраняем и подгоняем высоту
    el.addEventListener("input", () => {
      saveAll();
      autoGrow(el);
    });
  });

  // Ctrl+Z / Cmd+Z — шаг назад (но не мешаем родной отмене букв внутри поля)
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
      e.preventDefault();
      undo();
    }
  });

  // Загружаем сохранённое при открытии и сразу подгоняем высоту всех полей
  loadAll();
  FIELDS.forEach(id => autoGrow(document.getElementById(id)));

  // Показываем историю запросов
  renderLog();
</script>

</body>
</html>
