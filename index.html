<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI Prompt Builder — помощник для сборки понятных промптов к нейросетям: контекст, задача, условия и формат ответа.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<title>AI Prompt Builder</title>

<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e6ee;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.06);
  }

  /* Тёмная тема — выбрана вручную */
  :root[data-theme="dark"] {
    --bg: #0f1420;
    --card: #1a2030;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --border: #2b3346;
    --accent: #818cf8;
    --accent-hover: #a5b0ff;
    --danger: #f87171;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  /* Тёмная тема — авто по системе (если пользователь не выбрал светлую вручную) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1420;
      --card: #1a2030;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --border: #2b3346;
      --accent: #818cf8;
      --accent-hover: #a5b0ff;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.5;
    transition: background 0.25s, color 0.25s;
  }

  /* Шапка: заголовок слева, переключатель темы справа */
  .app-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  h2 {
    margin: 0 0 4px;
    font-size: 26px;
  }

  /* Градиентный текст логотипа */
  .logo-text {
    background: linear-gradient(90deg, var(--accent), #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Правый блок шапки: язык + тема */
  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  /* Переключатель языка */
  .lang-select {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
    cursor: pointer;
  }

  /* Кнопка переключения темы */
  .theme-toggle {
    flex-shrink: 0;
    font-size: 18px;
    line-height: 1;
    padding: 8px 12px;
    border-radius: 50%;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }

  .field {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .tooltip {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    overflow: hidden;
    min-height: 56px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  /* Главное действие + очистка */
  .actions-main {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 8px 0 28px;
  }

  .spacer { flex: 1; }

  /* Карточка результата */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .result-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .result-header h3 {
    margin: 0;
    margin-right: auto;
    font-size: 16px;
  }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  button {
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }

  button:hover {
    border-color: var(--accent);
  }

  /* Отклик при нажатии — лёгкое «вдавливание» */
  button:active {
    transform: translateY(1px);
  }

  /* Видимая рамка при навигации с клавиатуры */
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  /* Крупная главная кнопка «Собрать» */
  button.big {
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 600;
  }

  /* «Тихая» нейтральная кнопка (напр. «Шаг назад») */
  button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }

  button.ghost:hover {
    background: rgba(31, 36, 48, 0.06);
    border-color: transparent;
    color: var(--text);
  }

  /* «Тихая» опасная кнопка «Очистить» */
  button.ghost-danger {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }

  button.ghost-danger:hover {
    background: rgba(220, 38, 38, 0.08);
    border-color: transparent;
    color: var(--danger);
  }

  /* Редактор результата: подсветка-подложка под прозрачным полем */
  .editor {
    position: relative;
  }

  /* Подложка и поле должны совпадать ВСЕМИ метриками, чтобы текст лёг ровно */
  .editor-backdrop,
  #output {
    margin: 0;
    width: 100%;
    min-height: 200px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    box-sizing: border-box;
  }

  /* Подложка показывает текст; заголовки — серые */
  .editor-backdrop {
    position: absolute;
    inset: 0;
    color: var(--text);
    background: var(--card);
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  /* Само поле прозрачное — видно подложку, но курсор и ввод работают */
  #output {
    position: relative;
    z-index: 1;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    resize: none;
    overflow: hidden;
  }

  /* Заголовки промпта в подложке — приглушённые */
  .ph-header {
    color: var(--muted);
  }

  /* Плавное появление готового промпта */
  @keyframes promptAppear {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #outputHighlight.appear {
    animation: promptAppear 0.45s ease;
  }

  /* Мягкое уведомление (тост) */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2430;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 1000;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* История запросов */
  .history {
    margin-top: 28px;
  }

  .history-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .history-header h3 {
    margin: 0;
    font-size: 18px;
  }

  .info-hint {
    margin-right: auto;
    color: var(--muted);
    font-size: 15px;
    cursor: help;
  }

  .log-empty {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }

  .log-info {
    flex: 1;
    min-width: 0;
  }

  .log-title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .log-time {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .log-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .log-actions button {
    padding: 6px 8px;
    font-size: 15px;
  }

  /* Кнопка-действие внутри тоста (напр. «Отменить») */
  .toast-action {
    margin-left: 14px;
    padding: 4px 10px;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .toast-action:hover {
    background: rgba(255, 255, 255, 0.28);
  }

  .voice-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .voice-button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .voice-button svg { width: 18px; height: 18px; flex-shrink: 0; }
  .voice-button[aria-pressed="true"] { color: var(--danger); border-color: var(--danger); }
  .voice-status, .voice-help { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .voice-status:empty { display: none; }
  .voice-help { margin: 0 0 16px; }
  .voice-status[data-error="true"] { color: var(--danger); }
  @media (max-width: 480px) { .voice-controls { align-items: flex-start; flex-direction: column; } }
</style>

</head>
<body>

<div class="app-header">
  <div>
    <h2><span class="logo-emoji">🚀</span> <span class="logo-text">AI Prompt Builder</span></h2>
    <p class="subtitle" data-i18n="subtitle">Помощник для сборки понятных промптов к нейросетям</p>
  </div>
  <div class="header-controls">
    <select id="langSelect" class="lang-select" onchange="setLang(this.value)" data-i18n-title="lang_title" title="Язык интерфейса">
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="kk">Қазақша</option>
      <option value="es">Español</option>
      <option value="zh">中文</option>
      <option value="pt">Português</option>
    </select>
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" data-i18n-title="theme_toggle_title" title="Сменить тему (светлая/тёмная)">🌙</button>
  </div>
</div>

<p class="voice-help" id="voiceHelp"></p>

<div class="field">
  <label for="context" data-i18n="label_context" data-i18n-title="title_context" title="Что происходит? Опиши проект.">Контекст</label>
  <div class="tooltip" data-i18n="tooltip_context">Пример: Разрабатываю центр реабилитации...</div>
  <textarea id="context"></textarea>
</div>

<div class="field">
  <label for="task" data-i18n="label_task" data-i18n-title="title_task" title="Что нужно получить?">Задача</label>
  <div class="tooltip" data-i18n="tooltip_task">Пример: Сделать лучше, усилить концепцию...</div>
  <textarea id="task"></textarea>
</div>

<div class="field">
  <label for="limits" data-i18n="label_limits" data-i18n-title="title_limits" title="Какие условия и рамки?">Условия и рамки</label>
  <div class="tooltip" data-i18n="tooltip_limits">Пример: бюджет, сроки, технологии...</div>
  <textarea id="limits"></textarea>
</div>

<div class="field">
  <label for="format" data-i18n="label_format" data-i18n-title="title_format" title="Как должен выглядеть ответ?">Формат ответа</label>
  <div class="tooltip" data-i18n="tooltip_format">Пример: список + структура</div>
  <textarea id="format"></textarea>
</div>

<div class="actions-main">
  <button class="primary big" onclick="generatePrompt()" data-i18n="btn_build">🚀 Собрать промпт</button>
  <span class="spacer"></span>
  <button class="ghost" onclick="undo()" data-i18n="btn_undo" data-i18n-title="title_undo" title="Вернуть предыдущее состояние (Ctrl+Z)">↶ Шаг назад</button>
  <button class="ghost-danger" onclick="clearAll()" data-i18n="btn_clear">🧹 Очистить</button>
</div>

<div class="result-card">
  <div class="result-header">
    <h3 data-i18n="result_title">Готовый промпт (можно редактировать)</h3>
    <div class="result-actions">
      <button onclick="enhancePrompt()" data-i18n="btn_enhance">🧠 Усилить</button>
      <button class="primary" onclick="copyText()" data-i18n="btn_copy">📋 Копировать</button>
    </div>
  </div>
  <div class="editor">
    <div id="outputHighlight" class="editor-backdrop" aria-hidden="true"></div>
    <textarea id="output" rows="10"></textarea>
  </div>
</div>

<div class="history">
  <div class="history-header">
    <h3 data-i18n="history_title">🕘 История запросов</h3>
    <span class="info-hint" data-i18n-title="info_hint" title="Сохраняются последние 5 промптов. Когда появляется новый — самый старый удаляется автоматически.">ⓘ</span>
    <button class="ghost" onclick="clearLog()" data-i18n="btn_clear_history">Очистить историю</button>
  </div>
  <div id="logList"></div>
</div>

<div id="toast"></div>

  function resetVoiceEngine() {
    if (!voiceEngine) return;
    const engine = voiceEngine;
    voiceEngine = null;
    engine.worker.terminate();
    engine.rejectReady(new Error('cancelled'));
    engine.pending.forEach(request => request.reject(new Error('cancelled')));
    engine.pending.clear();
  }

  function getVoiceEngine() {
    if (voiceEngine) return voiceEngine;
    const worker = new Worker(new URL('voice-worker.js', document.baseURI), { type: 'module' });
    const engine = { worker, pending: new Map(), loaded: false };
    engine.ready = new Promise((resolve, reject) => { engine.resolveReady = resolve; engine.rejectReady = reject; });
    // Loading starts while recording; failure is also handled if the user cancels first.
    engine.ready.catch(() => {});
    voiceEngine = engine;
    function fail(error) {
      if (voiceEngine !== engine) return;
      resetVoiceEngine();
      if (voiceSession) failVoice(voiceSession, 'voice_load_failed');
      console.warn('Speech model could not load:', error);
    }
    worker.onerror = fail;
    worker.onmessage = ({ data }) => {
      if (voiceEngine !== engine) return;
      if (data.type === 'ready') {
        engine.loaded = true;
        engine.resolveReady();
      } else if (data.type === 'progress') {
        if (voiceSession?.phase === 'processing' && !engine.loaded) {
          const percent = Number.isFinite(data.progress) ? ' ' + Math.floor(data.progress) + '%' : '';
          voiceStatus(voiceSession.id, t('voice_loading') + percent);
        }
      } else if (data.type === 'result') {
        const request = engine.pending.get(data.id);
        engine.pending.delete(data.id);
        request?.resolve(data.text);
      } else if (data.type === 'error') {
        const request = engine.pending.get(data.id);
        if (request) {
          engine.pending.delete(data.id);
          request.reject(new Error(data.message));
        } else { fail(data.message); }
      }
    };
    worker.postMessage({ type: 'prepare' });
    return engine;
  }

    voiceStatus(session.id, '');
    refreshVoiceUI();

  async function finishVoice(session) {

      session.chunks = [];
      context = new AudioContext({ sampleRate: 16000 });
      const decoded = await context.decodeAudioData(await blob.arrayBuffer());
      // decodeAudioData resamples to the context sample rate; combine stereo if needed.
      const audio = new Float32Array(decoded.length);
      for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
        const samples = decoded.getChannelData(channel);
        for (let i = 0; i < audio.length; i++) audio[i] += samples[i] / decoded.numberOfChannels;
      }
      await context.close();
      context = null;
      if (voiceSession !== session) return;
      let energy = 0;
      for (const sample of audio) energy += sample * sample;
      if (audio.length < 4000 || Math.sqrt(energy / audio.length) < 0.002) {
        failVoice(session, 'voice_no_speech');
        return;

      await session.engine.ready;

      if (!finalText) { failVoice(session, 'voice_no_speech'); return; }

      const field = document.getElementById(session.id);
      field.value += (field.value && !/\s$/.test(field.value) ? ' ' : '') + finalText;

      voiceStatus(session.id, '');

        console.warn('Speech processing failed:', error);

  }

  async function toggleVoice(id) {
    if (!canRecordVoice) { voiceStatus(id, t('voice_unsupported'), true); return; }
    if (voiceSession?.id === id) {
      if (voiceSession.phase === 'recording') {
        voiceSession.phase = 'processing';
        releaseVoiceRecording(voiceSession);
        voiceStatus(id, t('voice_finishing'));
        refreshVoiceUI();
      } else { cancelVoice(); }
      return;
    }
    cancelVoice();
    const session = { id, sequence: ++voiceSequence, phase: 'starting', language: SPEECH_LANGUAGES[currentLang], chunks: [] };
    voiceSession = session;
    voiceStatus(id, t('voice_connecting'));
    refreshVoiceUI();
    try {
      // Ask for the microphone from the click, without waiting for any model download.
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
      if (voiceSession !== session) { stream.getTracks().forEach(track => track.stop()); return; }
      session.stream = stream;
      const mimeType = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(type => MediaRecorder.isTypeSupported(type));
      session.recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      session.recorder.ondataavailable = event => { if (event.data.size) session.chunks.push(event.data); };
      session.recorder.onstop = () => finishVoice(session);
      session.recorder.onerror = () => failVoice(session, 'voice_failed');
      session.engine = getVoiceEngine();
      session.recorder.start(1000);
      session.phase = 'recording';
      voiceStatus(id, t('voice_listening'));
      // Keep a single recording bounded; long recordings can be continued with another click.
      session.timer = setTimeout(() => {
        if (voiceSession === session && session.phase === 'recording') {
          session.phase = 'processing';
          releaseVoiceRecording(session);
          voiceStatus(id, t('voice_finishing'));
          refreshVoiceUI();
        }
      }, 120000);
    } catch (error) {
      const key = error.name === 'NotAllowedError' ? 'voice_permission'
        : error.name === 'NotFoundError' || error.name === 'NotReadableError' ? 'voice_microphone' : 'voice_failed';
      failVoice(session, key);
    }
  }


  function initVoice() {
    FIELDS.forEach(id => {
      const controls = document.createElement('div');
      controls.className = 'voice-controls';
      const button = document.createElement('button');
      button.id = 'voice-' + id;
      button.type = 'button';
      button.className = 'voice-button';
      button.setAttribute('aria-controls', id);
      button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span></span>';
      button.addEventListener('click', () => toggleVoice(id));
      const status = document.createElement('span');
      status.id = 'voice-status-' + id;
      status.className = 'voice-status';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      status.setAttribute('aria-atomic', 'true');
      controls.append(button, status);
      const field = document.getElementById(id);
      (id === 'output' ? field.parentElement : field).after(controls);
      field.addEventListener('beforeinput', cancelVoice);
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelVoice(); });
    window.addEventListener('pagehide', cancelVoice);
  }

  // Текущий язык + помощник перевода
  let currentLang = "en";

  function t(key) {
    return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
  }

  // Определить язык: сохранённый → системный → английский
  function detectLang() {
    const saved = localStorage.getItem("pb_lang");
    if (saved && I18N[saved]) return saved;
    const sys = (navigator.language || "en").slice(0, 2).toLowerCase();
    return I18N[sys] ? sys : "en";
  }

  // Применить переводы ко всем помеченным элементам
  function applyLang() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-title]").forEach(el => {
      el.title = t(el.getAttribute("data-i18n-title"));
    });
    const sel = document.getElementById("langSelect");
    if (sel) sel.value = currentLang;
    refreshVoiceUI();
    renderLog(); // перерисовать историю (даты и подписи зависят от языка)
  }

  // Сменить язык по выбору пользователя
  function setLang(lang) {
    cancelVoice();
    currentLang = I18N[lang] ? lang : "en";
    localStorage.setItem("pb_lang", currentLang);
    applyLang();
  }

  // --- История для «Шага назад» (хранит до 5 прошлых состояний) ---
  const HISTORY_LIMIT = 5;
  let history = [];

  // Снимок текущего содержимого всех полей
  function snapshot() {
    const s = {};
    FIELDS.forEach(id => s[id] = document.getElementById(id).value);
    return s;
  }

  // Два состояния одинаковы?
  function sameState(a, b) {
    return FIELDS.every(id => a[id] === b[id]);
  }

  // Положить конкретное состояние в историю (без дублей, не больше 5)
  function pushState(state) {
    if (history.length && sameState(history[history.length - 1], state)) return;
    history.push(state);
    if (history.length > HISTORY_LIMIT) history.shift();
  }

  // Сохранить ТЕКУЩЕЕ состояние в историю (перед изменением)
  function recordHistory() {
    pushState(snapshot());
  }

  // Применить состояние к полям
  function applyState(s) {
    cancelVoice();
    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      el.value = s[id];
      autoGrow(el);
    });
    saveAll();
  }

  // Шаг назад: вернуть предыдущее состояние
  function undo() {
    cancelVoice();
    if (!history.length) {
      showToast(t("toast_nothing_undo"));
      return;
    }
    const cur = snapshot();
    let prev = history.pop();
    // если последнее сохранённое совпадает с текущим — берём ещё предыдущее
    if (sameState(prev, cur) && history.length) prev = history.pop();
    applyState(prev);
    showToast(t("toast_undo"));
  }

  // ===== Тема (светлая/тёмная) =====
  function isDarkNow() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t === "dark") return true;
    if (t === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches; // авто по системе
  }

  function updateThemeIcon() {
    const btn = document.getElementById("themeToggle");
    if (btn) btn.textContent = isDarkNow() ? "☀️" : "🌙";
  }

  function applyTheme(theme) {
    if (theme === "dark" || theme === "light") {
      document.documentElement.setAttribute("data-theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme"); // авто
    }
    updateThemeIcon();
  }

  function toggleTheme() {
    const next = isDarkNow() ? "light" : "dark";
    localStorage.setItem("pb_theme", next);
    applyTheme(next);
  }

  // --- Авто-рост поля по высоте текста ---
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
    if (el.id === "output") renderOutputHighlight(); // держим подложку в синхроне
  }

  // --- Мягкое уведомление вместо alert ---
  // action (необязательно): { label, callback } — добавляет кнопку, напр. «Отменить»
  let toastTimer = null;
  function showToast(message, action) {
    const toast = document.getElementById("toast");
    toast.textContent = message;

    if (action) {
      const btn = document.createElement("button");
      btn.className = "toast-action";
      btn.textContent = action.label;
      btn.onclick = () => {
        action.callback();
        toast.classList.remove("show");
      };
      toast.appendChild(btn);
    }

    // Кнопку можно нажать, только если она есть
    toast.style.pointerEvents = action ? "auto" : "none";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    // Если есть действие — даём больше времени на нажатие
    toastTimer = setTimeout(() => toast.classList.remove("show"), action ? 5000 : 2200);
  }

  // --- Сборка промпта ---
  function generatePrompt() {
    cancelVoice();
    recordHistory();
    const context = document.getElementById("context").value;
    const task = document.getElementById("task").value;
    const limits = document.getElementById("limits").value;
    const format = document.getElementById("format").value;

    const prompt =
      t("prompt_context") + ":\n" + context +
      "\n\n" + t("prompt_task") + ":\n" + task +
      "\n\n" + t("prompt_limits") + ":\n" + limits +
      "\n\n" + t("prompt_format") + ":\n" + format;

    const output = document.getElementById("output");
    output.value = prompt;
    autoGrow(output);
    saveAll();

    // Сохраняем в историю запросов (если заполнено хоть одно поле)
    if ([context, task, limits, format].some(v => v.trim() !== "")) {
      const now = Date.now();
      addToLog({
        id: now,
        time: now,
        fields: { context, task, limits, format },
        prompt: prompt
      });
    }

    // Перезапуск анимации появления (на подложке-подсветке)
    const bd = document.getElementById("outputHighlight");
    bd.classList.remove("appear");
    void bd.offsetWidth; // заставляем браузер «заметить» сброс
    bd.classList.add("appear");
  }

  // --- Усилить: дописывает инструкцию сверху (без повторов) ---
  function enhancePrompt() {
    cancelVoice();
    const output = document.getElementById("output");
    const note = t("enhance_note");
    if (!output.value.trim()) {
      showToast(t("toast_need_build"));
      return;
    }
    if (output.value.startsWith(note)) {
      showToast(t("toast_enhance_added"));
      return;
    }
    recordHistory();
    output.value = note + output.value;
    autoGrow(output);
    saveAll();
  }

  // --- Копирование текста в буфер (общий помощник) ---
  async function copyToClipboard(text) {
    if (!text.trim()) {
      showToast(t("toast_copy_empty"));
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      showToast(t("toast_copied"));
    } catch (e) {
      // Резервный способ (если основной заблокирован браузером)
      const tmp = document.createElement("textarea");
      tmp.value = text;
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      document.body.appendChild(tmp);
      tmp.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(tmp);
      showToast(ok ? t("toast_copied") : t("toast_copy_fail"));
    }
  }

  // Кнопка «Копировать» у готового промпта
  function copyText() {
    copyToClipboard(document.getElementById("output").value);
  }

  // --- Очистить все поля (сразу, с возможностью отменить) ---
  function clearAll() {
    cancelVoice();
    // Если и так пусто — ничего не делаем
    const hadText = FIELDS.some(id => document.getElementById(id).value.trim() !== "");
    if (!hadText) {
      showToast(t("toast_clear_already"));
      return;
    }

    recordHistory(); // запоминаем перед очисткой
    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      el.value = "";
      autoGrow(el);
    });
    saveAll();

    // Мягкое уведомление с кнопкой «Отменить» (делает шаг назад)
    showToast(t("toast_cleared"), { label: t("toast_undo_label"), callback: undo });
  }

  // ===== История запросов =====
  const LOG_KEY = "pb_log";
  const LOG_MAX = 5; // храним только последние 5 промптов

  function loadLog() {
    try {
      return JSON.parse(localStorage.getItem(LOG_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveLog(list) {
    localStorage.setItem(LOG_KEY, JSON.stringify(list));
  }

  // Добавить запись (новые — сверху, дубли пропускаем, держим максимум 5)
  function addToLog(entry) {
    const list = loadLog();
    if (list.length && list[0].prompt === entry.prompt) return;
    list.unshift(entry);
    if (list.length > LOG_MAX) list.length = LOG_MAX;
    saveLog(list);
    renderLog();
  }

  function deleteFromLog(id) {
    saveLog(loadLog().filter(e => e.id !== id));
    renderLog();
  }

  function clearLog() {
    if (!loadLog().length) {
      showToast(t("toast_history_empty"));
      return;
    }
    saveLog([]);
    renderLog();
    showToast(t("toast_history_cleared"));
  }

  function copyFromLog(id) {
    const entry = loadLog().find(e => e.id === id);
    if (entry) copyToClipboard(entry.prompt);
  }

  // Загрузить запись обратно в форму
  function loadFromLog(id) {
    cancelVoice();
    const entry = loadLog().find(e => e.id === id);
    if (!entry) return;
    recordHistory(); // чтобы загрузку можно было отменить «Шагом назад»
    FIELDS.forEach(fid => {
      const el = document.getElementById(fid);
      el.value = (fid === "output") ? entry.prompt : (entry.fields[fid] || "");
      autoGrow(el);
    });
    saveAll();
    showToast(t("toast_loaded"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Защита от поломки разметки чужим текстом
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Набор всех заголовков промпта (на всех языках) — для подсветки
  const HEADER_SET = new Set();
  Object.values(I18N).forEach(L => {
    ["prompt_context", "prompt_task", "prompt_limits", "prompt_format"].forEach(k => {
      if (L[k]) HEADER_SET.add(L[k] + ":");
    });
  });

  // Раскраска подложки: строки-заголовки серые, текст пользователя обычный
  function highlightHeaders(text) {
    return text.split("\n").map(line =>
      HEADER_SET.has(line.trim())
        ? '<span class="ph-header">' + escapeHtml(line) + '</span>'
        : escapeHtml(line)
    ).join("\n");
  }

  // Обновить подложку под текущим содержимым поля
  function renderOutputHighlight() {
    const bd = document.getElementById("outputHighlight");
    if (bd) bd.innerHTML = highlightHeaders(document.getElementById("output").value);
  }

  // Короткий заголовок записи (берём «Задачу», иначе сам промпт)
  function logTitle(entry) {
    const raw = (entry.fields && entry.fields.task && entry.fields.task.trim())
      ? entry.fields.task.trim()
      : entry.prompt.trim();
    const oneLine = raw.replace(/\s+/g, " ");
    return oneLine.length > 70 ? oneLine.slice(0, 70) + "…" : (oneLine || t("log_untitled"));
  }

  function formatTime(ms) {
    return new Date(ms).toLocaleString(currentLang, {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function renderLog() {
    const box = document.getElementById("logList");
    const list = loadLog();
    if (!list.length) {
      box.innerHTML = '<p class="log-empty">' + escapeHtml(t("log_empty")) + '</p>';
      return;
    }
    box.innerHTML = list.map(e => `
      <div class="log-item">
        <div class="log-info">
          <div class="log-title">${escapeHtml(logTitle(e))}</div>
          <div class="log-time">${formatTime(e.time)}</div>
        </div>
        <div class="log-actions">
          <button class="ghost" onclick="copyFromLog(${e.id})" title="${escapeHtml(t("title_copy"))}">📋</button>
          <button class="ghost" onclick="loadFromLog(${e.id})" title="${escapeHtml(t("title_load"))}">↩️</button>
          <button class="ghost" onclick="deleteFromLog(${e.id})" title="${escapeHtml(t("title_delete"))}">🗑</button>
        </div>
      </div>
    `).join("");
  }

  // --- Память между запусками (localStorage) ---
  function saveAll() {
    FIELDS.forEach(id => {
      localStorage.setItem("pb_" + id, document.getElementById(id).value);
    });
  }

  function loadAll() {
    FIELDS.forEach(id => {
      const saved = localStorage.getItem("pb_" + id);
      if (saved !== null) document.getElementById(id).value = saved;
    });
  }

  // Состояние поля в момент, когда пользователь начал его редактировать
  let editStartState = null;

  FIELDS.forEach(id => {
    const el = document.getElementById(id);

    // Проверка орфографии (подчёркивает ошибки)
    el.spellcheck = true;

    // Запоминаем состояние ДО начала редактирования
    el.addEventListener("focus", () => { editStartState = snapshot(); });

    // Если при уходе из поля содержимое изменилось — сохраняем в историю
    el.addEventListener("blur", () => {
      if (editStartState && !sameState(editStartState, snapshot())) {
        pushState(editStartState);
      }
    });

    // При наборе: сохраняем и подгоняем высоту
    el.addEventListener("input", () => {
      saveAll();
      autoGrow(el);
    });
  });

  // Ctrl+Z / Cmd+Z — шаг назад (но не мешаем родной отмене букв внутри поля)
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
      e.preventDefault();
      undo();
    }
  });

  // Загружаем сохранённое при открытии и сразу подгоняем высоту всех полей
  initVoice();
  loadAll();
  FIELDS.forEach(id => autoGrow(document.getElementById(id)));

  // Применяем язык (сохранённый или системный) — заодно переведёт интерфейс и отрисует историю
  currentLang = detectLang();
  applyLang();

  // Применяем сохранённую тему (или авто по системе)
  applyTheme(localStorage.getItem("pb_theme"));
</script>

</body>
</html>
